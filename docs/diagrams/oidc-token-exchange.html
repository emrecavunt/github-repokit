<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How GitHub Actions gets keyless cloud access · Sequence</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1100px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 840px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · OIDC / WIF</p>
    <h1>How GitHub Actions gets keyless cloud access</h1>

    <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="oidc-exchange-title oidc-exchange-desc">
      <title id="oidc-exchange-title">How GitHub Actions gets keyless cloud access</title>
      <desc id="oidc-exchange-desc">A workflow job requests a per-run OIDC token from GitHub, exchanges it at the cloud security token service which verifies the signature and claims, and receives short-lived credentials to call cloud APIs, with no stored secret.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
        </marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ================= LIFELINES · Job 128 · Issuer 384 · STS 640 · Resource 880 ================= -->
      <line x1="128" y1="128" x2="128" y2="496" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="384" y1="128" x2="384" y2="496" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="640" y1="128" x2="640" y2="496" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="880" y1="128" x2="880" y2="496" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- ================= ACTIVATION BARS ================= -->
      <rect x="124" y="172" width="8" height="296" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="380" y="176" width="8" height="44" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="636" y="264" width="8" height="116" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="876" y="424" width="8" height="44" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

      <!-- M1: Job → Issuer · request per-run id token -->
      <line x1="132" y1="176" x2="376" y2="176" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="208" y="156" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="252" y="165" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">REQUEST TOKEN</text>

      <!-- M2: Issuer → Job · signed JWT (return: dashed + filled) -->
      <line x1="380" y1="216" x2="136" y2="216" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="216" y="196" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="252" y="205" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">JWT · CLAIMS</text>

      <!-- M3: Job → STS · exchange the JWT -->
      <line x1="132" y1="264" x2="632" y2="264" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="216" y="244" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="260" y="253" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXCHANGE JWT</text>

      <!-- M4: STS self-message · verify signature + claims -->
      <path d="M 644,296 H 680 Q 688,296 688,304 V 316 Q 688,324 680,324 H 652"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="700" y="305" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">VERIFY JWT SIG</text>
      <text x="700" y="321" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">MATCH CLAIMS</text>

      <!-- M5: STS → Job · short-lived credentials (headline success, coral) -->
      <line x1="636" y1="376" x2="136" y2="376" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <rect x="208" y="356" width="104" height="12" rx="2" fill="#f5f5f5"/>
      <text x="260" y="365" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TEMP CREDS ≤1H</text>

      <!-- M6: Job → Resource · API call with temporary credentials -->
      <line x1="132" y1="424" x2="872" y2="424" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="476" y="404" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="512" y="413" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API + CREDS</text>

      <!-- M7: Resource → Job · response (return: dashed + filled) -->
      <line x1="876" y1="464" x2="136" y2="464" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="488" y="444" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="512" y="453" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">200 OK</text>

      <!-- ================= ANNOTATION CALLOUT ================= -->
      <text x="904" y="36" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">trust is re-evaluated on every job run;</text>
      <text x="904" y="56" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">no stored key to leak</text>
      <path d="M 748,60 Q 700,66 668,68" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="664" cy="68" r="2" fill="#2d3142"/>

      <!-- ================= ACTOR BOXES · drawn after arrows ================= -->
      <!-- Workflow Job (input / soft) -->
      <rect x="56" y="72" width="144" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="56" y="72" width="144" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="64" y="80" width="24" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
      <text x="76" y="89" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CI</text>
      <text x="128" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Workflow Job</text>
      <text x="128" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">actions runner</text>

      <!-- GitHub OIDC issuer (backend) -->
      <rect x="312" y="72" width="144" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="312" y="72" width="144" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="320" y="80" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="334" y="89" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">IDP</text>
      <text x="384" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">GitHub OIDC</text>
      <text x="384" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">id token issuer</text>

      <!-- Cloud STS (focal) -->
      <rect x="568" y="72" width="144" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="568" y="72" width="144" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="576" y="80" width="28" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="590" y="89" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STS</text>
      <text x="640" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Cloud STS</text>
      <text x="640" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">AWS STS · GCP STS</text>

      <!-- Cloud resource (external) -->
      <rect x="808" y="72" width="144" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="808" y="72" width="144" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="816" y="80" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="830" y="89" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
      <text x="880" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Cloud Resource</text>
      <text x="880" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">secrets · gcp apis</text>

      <!-- ================= LEGEND ================= -->
      <line x1="56" y1="528" x2="904" y2="528" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="56" y="544" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="56" y="560" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="76" y="568" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Focal / verifier</text>

      <line x1="200" y1="564" x2="228" y2="564" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="236" y="568" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">HTTP call</text>

      <line x1="336" y1="564" x2="364" y2="564" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="372" y="568" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Return</text>

      <line x1="448" y1="564" x2="476" y2="564" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="484" y="568" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Headline success</text>
    </svg>
  </div>
</body>
</html>
