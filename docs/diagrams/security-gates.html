<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The OIDC trust gates · Flowchart</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1100px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 840px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Security model</p>
    <h1>The OIDC trust gates</h1>

    <svg viewBox="0 0 1000 896" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="oidc-gates-title oidc-gates-desc">
      <title id="oidc-gates-title">The OIDC trust gates</title>
      <desc id="oidc-gates-desc">Every credential exchange passes three gates — issuer signature, audience, and the repository claim in the trust condition — before short-lived, narrowly scoped credentials are minted; any failure ends with no credentials issued.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ================= ARROWS (before nodes) ================= -->
      <!-- Start → D1 -->
      <line x1="400" y1="112" x2="400" y2="156" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- D1 → D2 (yes) -->
      <line x1="400" y1="256" x2="400" y2="296" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="408" y="268" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="412" y="277" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">YES</text>

      <!-- D2 → D3 (yes) -->
      <line x1="400" y1="396" x2="400" y2="436" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="408" y="408" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="412" y="417" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">YES</text>

      <!-- D3 → Mint (yes, accent happy path) -->
      <line x1="400" y1="536" x2="400" y2="576" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <rect x="408" y="548" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="412" y="557" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">YES</text>

      <!-- Mint → Scope -->
      <line x1="400" y1="636" x2="400" y2="668" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Scope → End -->
      <line x1="400" y1="728" x2="400" y2="760" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- D1 NO → rail -->
      <path d="M 512,208 H 704 Q 712,208 712,216 V 344" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
      <rect x="584" y="188" width="24" height="12" rx="2" fill="#f5f5f5"/>
      <text x="596" y="197" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>

      <!-- D2 NO → merge dot -->
      <line x1="512" y1="348" x2="704" y2="348" stroke="#4f5d75" stroke-width="1.2"/>
      <rect x="584" y="328" width="24" height="12" rx="2" fill="#f5f5f5"/>
      <text x="596" y="337" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>

      <!-- rail between merge dots -->
      <line x1="712" y1="348" x2="712" y2="484" stroke="#4f5d75" stroke-width="1.2"/>

      <!-- D3 NO → merge dot -->
      <line x1="512" y1="488" x2="704" y2="488" stroke="#4f5d75" stroke-width="1.2"/>
      <rect x="584" y="468" width="24" height="12" rx="2" fill="#f5f5f5"/>
      <text x="596" y="477" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>

      <!-- rail → Denied -->
      <line x1="712" y1="488" x2="712" y2="576" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- merge dots -->
      <circle cx="712" cy="348" r="4" fill="#2d3142"/>
      <circle cx="712" cy="488" r="4" fill="#2d3142"/>

      <!-- ================= ANNOTATION CALLOUT ================= -->
      <text x="56" y="700" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">vs. a stored key: nothing to rotate,</text>
      <text x="56" y="720" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">nothing to leak — gates run on every job</text>
      <path d="M 140,688 Q 200,652 268,612" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="272" cy="608" r="2" fill="#2d3142"/>

      <!-- ================= NODES ================= -->
      <!-- Start oval -->
      <rect x="280" y="64" width="240" height="48" rx="24" fill="#f5f5f5"/>
      <rect x="280" y="64" width="240" height="48" rx="24" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="400" y="86" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Workflow presents OIDC JWT</text>
      <text x="400" y="102" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">minted per job run</text>

      <!-- D1: signature -->
      <polygon points="400,160 512,208 400,256 288,208" fill="#f5f5f5"/>
      <polygon points="400,160 512,208 400,256 288,208" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="400" y="204" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Signature valid?</text>
      <text x="400" y="220" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">github oidc issuer</text>

      <!-- D2: audience -->
      <polygon points="400,300 512,348 400,396 288,348" fill="#f5f5f5"/>
      <polygon points="400,300 512,348 400,396 288,348" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="400" y="344" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Audience match?</text>
      <text x="400" y="360" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">aud = sts / wif provider</text>

      <!-- D3: repository claim (focal) -->
      <polygon points="400,440 512,488 400,536 288,488" fill="#f5f5f5"/>
      <polygon points="400,440 512,488 400,536 288,488" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="400" y="484" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Repo claim trusted?</text>
      <text x="400" y="500" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">sub / assertion.repository</text>

      <!-- Mint credentials -->
      <rect x="280" y="580" width="240" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="280" y="580" width="240" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="400" y="604" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Mint short-lived credentials</text>
      <text x="400" y="620" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">aws sts · gcp sts · expiring</text>

      <!-- Scoped permissions -->
      <rect x="280" y="672" width="240" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="280" y="672" width="240" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="400" y="696" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Scoped permissions only</text>
      <text x="400" y="712" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">listed ARNs · project roles</text>

      <!-- End oval -->
      <rect x="288" y="764" width="224" height="48" rx="24" fill="#f5f5f5"/>
      <rect x="288" y="764" width="224" height="48" rx="24" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="400" y="786" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Job runs · creds expire</text>
      <text x="400" y="802" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">max session ≤ 1h</text>

      <!-- Denied oval -->
      <rect x="600" y="580" width="224" height="56" rx="28" fill="#f5f5f5"/>
      <rect x="600" y="580" width="224" height="56" rx="28" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="712" y="604" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Denied — no credentials</text>
      <text x="712" y="620" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">exchange rejected</text>

      <!-- ================= LEGEND ================= -->
      <line x1="56" y1="836" x2="944" y2="836" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="56" y="852" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <polygon points="63,864 77,870 63,876 49,870" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="88" y="874" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Decision gate</text>

      <rect x="200" y="864" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="220" y="874" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Step</text>

      <rect x="288" y="864" width="18" height="10" rx="5" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="314" y="874" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Start / end</text>

      <polygon points="423,864 437,870 423,876 409,870" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="448" y="874" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Focal gate — the trust condition</text>

      <line x1="624" y1="870" x2="652" y2="870" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="660" y="874" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Happy path</text>

      <circle cx="776" cy="870" r="4" fill="#2d3142"/>
      <text x="788" y="874" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Merge point</text>
    </svg>
  </div>
</body>
</html>
